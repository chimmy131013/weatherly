name: Deploy Weatherly to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd weatherly
            git pull origin main
            sudo docker stop weatherly || true
            sudo docker rm weatherly || true
            sudo docker build -t weatherly .
            sudo docker run -d --env-file .env -p 80:5000 --name weatherly weatherly